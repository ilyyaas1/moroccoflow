spring:
  application:
    name: moroccoflow

  datasource:
    url: jdbc:postgresql://localhost:5433/moroccoflow
    username: moroccoflow
    password: moroccoflow_dev_password

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC

  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

moroccoflow:
  congestion:
    speed-weight: 0.6
    occupancy-weight: 0.4
    moderate-threshold: 0.30
    high-threshold: 0.60
    critical-threshold: 0.80



