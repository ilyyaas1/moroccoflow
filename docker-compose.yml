services:
  postgres:
    image: postgres:17-alpine
    container_name: moroccoflow-postgres
    environment:
      POSTGRES_DB: moroccoflow
      POSTGRES_USER: moroccoflow
      POSTGRES_PASSWORD: moroccoflow_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moroccoflow -d moroccoflow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data: